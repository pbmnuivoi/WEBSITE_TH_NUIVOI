<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e4a8c">
  <title>Cổng thông tin trường học</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="top">
      <div class="wrap top-inner">
        <a class="brand" href="#" id="btnHome">
          <span class="brand-ico" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3L2 9l10 6 10-6-10-6z" fill="currentColor"/><path d="M2 15l10 6 10-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </span>
          <span>
            <strong id="schoolName">Cổng thông tin trường học</strong>
            <small>Thông tin · Tiện ích · Làm việc</small>
          </span>
        </a>

        <nav class="nav" id="nav" aria-label="Menu"></nav>

        <div class="top-right">
          <button type="button" class="btn btn-outline" id="btnLogin">Đăng nhập</button>
          <div class="who hidden" id="who">
            <span class="ava" id="ava">A</span>
            <span id="whoName">User</span>
            <button type="button" class="btn btn-text" id="btnLogout">Thoát</button>
          </div>
          <button type="button" class="burger" id="burger" aria-label="Menu">☰</button>
        </div>
      </div>
      <div class="mnav hidden" id="mnav"></div>
    </header>

    <!-- Main -->
    <main class="wrap main" id="main">
      <div class="skeleton" id="boot">
        <div class="sk sk-hero"></div>
        <div class="sk sk-line"></div>
        <div class="sk-row"><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div></div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="foot">
      <div class="wrap foot-grid">
        <div>
          <strong id="fName">Cổng thông tin trường học</strong>
          <p id="fAddr" class="dim">Địa chỉ đơn vị</p>
        </div>
        <div>
          <strong>Liên hệ</strong>
          <p id="fContact" class="dim">—</p>
        </div>
        <div>
          <strong>Hệ thống</strong>
          <p class="dim">Phiên bản 1.2 · Nội bộ</p>
        </div>
      </div>
    </footer>
  </div>

  <!-- Login modal: ẩn mặc định, không bao giờ che trang chủ khi load -->
  <div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <div class="overlay-bg" id="overlayBg"></div>
    <div class="dialog">
      <button type="button" class="x" id="btnCloseLogin" aria-label="Đóng">×</button>
      <div class="dialog-ico">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 3L2 9l10 6 10-6-10-6z" fill="currentColor"/><path d="M2 15l10 6 10-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </div>
      <p class="eyebrow">Cán bộ · Giáo viên · Nhân viên</p>
      <h2 id="loginTitle">Đăng nhập</h2>
      <p class="dim">Tài khoản do nhà trường cấp.</p>
      <form id="loginForm">
        <label>Tên đăng nhập
          <input id="username" name="username" autocomplete="username" required>
        </label>
        <label>Mật khẩu
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-primary full" id="loginBtn">Đăng nhập</button>
        <p class="err" id="loginErr" role="alert"></p>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
