<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2457a7">
  <title>Cổng thông tin trường học</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loginView" class="login-wrap">
    <form id="loginForm" class="login-card">
      <div class="brand-mark">✦</div>
      <p class="eyebrow">HỆ THỐNG NỘI BỘ</p>
      <h1>Cổng thông tin trường học</h1>
      <p class="muted">Đăng nhập bằng tài khoản được nhà trường cấp.</p>
      <label>Tên đăng nhập<input id="username" autocomplete="username" required></label>
      <label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary full" type="submit">Đăng nhập</button>
      <p id="loginError" class="error" role="alert"></p>
    </form>
  </div>

  <div id="appView" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="school-brand"><div class="brand-mark small">✦</div><div><b id="sideSchoolName">Cổng thông tin</b><small>Không gian làm việc số</small></div></div>
      <nav id="menuList" class="nav-list"></nav>
      <div class="side-bottom"><span class="status-dot"></span> Hệ thống nội bộ</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button id="menuToggle" class="icon-btn" aria-label="Mở menu">☰</button>
        <div class="breadcrumb" id="breadcrumb">Trang chủ</div>
        <div class="user-area"><div class="avatar" id="avatar">U</div><div class="user-label"><b id="userName"></b><small id="userRole"></small></div><button id="logoutBtn" class="btn ghost">Đăng xuất</button></div>
      </header>
      <section id="pageContent" class="content"></section>
      <footer id="footer" class="footer"></footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
